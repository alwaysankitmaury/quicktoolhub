<script>
(function () {

  /* ---------- 404 / error state ---------- */

  function fieldHTML(f) {

    if (f.type === 'checkbox') {

    ['min', 'max', 'step', 'maxlength', 'pattern'].forEach(function (k) { if (o[k] != null) a += ' ' + k + '="' + esc(o[k]) + '"'; });
    return '<div>' + lbl + '<input type="' + f.type + '"' + common + a + ' value="' + esc(f.def) + '" class="' + FIELD + '"' + ph + ' autocomplete="off">' + help + '</div>';
  }

  var BUILTIN = /^(trim|trimStart|trimEnd|split|length|toString|toUpperCase|toLowerCase|replace|replaceAll|match|matchAll|slice|substring|substr|indexOf|lastIndexOf|includes|startsWith|endsWith|charAt|charCodeAt|codePointAt|padStart|padEnd|repeat|normalize|localeCompare|concat|search|toFixed|toPrecision|valueOf|at|map|forEach|filter|reduce|join|push|pop|some|every|find|sort|reverse)$/;

  function renderTool(tool) {
    var title = toolTitle(tool), desc = toolDesc(tool), cat = toolCat(tool);
    setMeta(title + ' - Free Online Tool | QuickToolHub', desc || (title + ' - free online tool by QuickToolHub.'));
    var inputs = (Array.isArray(tool.inputs) ? tool.inputs : []).map(normInput);
    var faqs = normFaqs(tool.faqs || tool.faq);
    var guide = contentHTML(tool.content || tool.guide || tool.howTo);

    var crumbs = '<li><a class="hover:text-teal-700 dark:hover:text-teal-400" href="index.html">Home</a></li>' +
      (cat ? '<li aria-hidden="true"><i class="fa-solid fa-chevron-right text-[10px]"></i></li><li><a class="hover:text-teal-700 dark:hover:text-teal-400" href="index.html?category=' + encodeURIComponent(cat) + '">' + esc(cat) + '</a></li>' : '') +
      '<li aria-hidden="true"><i class="fa-solid fa-chevron-right text-[10px]"></i></li><li class="text-slate-800 dark:text-slate-200 font-medium truncate" aria-current="page">' + esc(title) + '</li>';

    var icon = tool.icon && /^[\w\- ]+$/.test(tool.icon) ? '<i class="' + esc(tool.icon) + ' mr-2" aria-hidden="true"></i>' : '';

    var html =
      '<nav aria-label="Breadcrumb" class="mb-5"><ol class="flex flex-wrap items-center gap-2 text-sm text-slate-500 dark:text-slate-400">' + crumbs + '</ol></nav>' +
      '<header class="mb-6">' +
        (cat ? '<span class="inline-flex items-center rounded-full bg-teal-100 text-teal-800 dark:bg-teal-900/50 dark:text-teal-300 px-3 py-1 text-xs font-semibold mb-3">' + icon + esc(cat) + '</span>' : '') +
        '<h1 class="text-3xl sm:text-4xl font-bold tracking-tight">' + esc(title) + '</h1>' +
        (desc ? '<p class="mt-3 text-lg text-slate-600 dark:text-slate-400 leading-relaxed">' + esc(desc) + '</p>' : '') +
      '</header>' +
      '<section aria-label="' + esc(title) + ' workspace" class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 sm:p-7 shadow-sm">' +
        '<form id="toolForm" novalidate class="space-y-5">' +
          inputs.map(fieldHTML).join('') +
          '<div class="flex flex-wrap gap-3 pt-1">' +
            '<button type="submit" id="runBtn" class="' + BTN + ' bg-teal-700 hover:bg-teal-800 text-white"><i class="fa-solid fa-play text-xs" aria-hidden="true"></i><span>' + esc(tool.buttonText || tool.cta || 'Run Tool') + '</span></button>' +
            '<button type="button" id="resetBtn" class="' + BTN + ' border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800"><i class="fa-solid fa-rotate-left text-xs" aria-hidden="true"></i>Clear / Reset</button>' +
          '</div>' +
        '</form>' +
        '<div id="alertBox" role="alert" class="hidden mt-5 rounded-lg border border-red-300 dark:border-red-900 bg-red-50 dark:bg-red-950/50 text-red-800 dark:text-red-300 px-4 py-3 text-sm"></div>' +
        '<div id="resultWrap" class="hidden mt-6">' +
          '<div class="flex items-center justify-between mb-2">' +
            '<h2 class="text-sm font-semibold text-slate-500 dark:text-slate-400">Result</h2>' +
            '<button type="button" id="copyBtn" class="inline-flex items-center gap-2 rounded-lg border border-slate-300 dark:border-slate-700 px-3 py-1.5 text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-600"><i class="fa-regular fa-copy" aria-hidden="true"></i><span>Copy Result</span></button>' +
          '</div>' +
          '<div id="result" aria-live="polite" class="result-box rounded-xl border-l-4 border-teal-600 bg-slate-100 dark:bg-slate-800/70 px-5 py-4 text-xl sm:text-2xl leading-relaxed min-h-[5rem] whitespace-pre-wrap"></div>' +
        '</div>' +
      '</section>';

    if (guide) html += '<article class="prose prose-slate dark:prose-invert max-w-none mt-10 prose-headings:tracking-tight"><h2>How to use ' + esc(title) + '</h2>' + guide + '</article>';
    if (faqs.length) {
      html += '<section class="mt-10" aria-labelledby="faqH"><h2 id="faqH" class="text-2xl font-bold tracking-tight mb-4">Frequently asked questions</h2><div class="space-y-3">' +
        faqs.map(function (f) {
          return '<details class="group rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">' +
            '<summary class="flex items-center justify-between gap-4 cursor-pointer px-5 py-4 font-semibold focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-600 rounded-xl">' + esc(f.q) + '<i class="fa-solid fa-chevron-down text-xs text-slate-400 transition-transform group-open:rotate-180" aria-hidden="true"></i></summary>' +
            '<div class="prose prose-slate dark:prose-invert max-w-none px-5 pb-4 -mt-1">' + para(f.a) + '</div></details>';
        }).join('') + '</div></section>';
    }
    app.innerHTML = html;

    if (faqs.length) {
      try {
        var ld = document.createElement('script');
        ld.type = 'application/ld+json';
        ld.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'FAQPage', mainEntity: faqs.map(function (f) {
          return { '@type': 'Question', name: f.q, acceptedAnswer: { '@type': 'Answer', text: String(f.a).replace(/<[^>]+>/g, '') } };
        }) });
        document.head.appendChild(ld);
      } catch (e) {}
    }

    /* wiring */
    var form = $('#toolForm'), alertBox = $('#alertBox'), wrap = $('#resultWrap'), out = $('#result'),
        copyBtn = $('#copyBtn'), runBtn = $('#runBtn'), copyTimer;

    function grow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight + 2, 480) + 'px'; }
    form.querySelectorAll('textarea[data-auto]').forEach(function (t) { t.addEventListener('input', function () { grow(t); }); grow(t); });

    function showError(msg) {
      alertBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-2" aria-hidden="true"></i>' + esc(msg);
      alertBox.classList.remove('hidden');
      wrap.classList.add('hidden');
    }
    function resetCopy() {
      clearTimeout(copyTimer);
      copyBtn.querySelector('span').textContent = 'Copy Result';
      copyBtn.querySelector('i').className = 'fa-regular fa-copy';
    }

    async function run() {
      alertBox.classList.add('hidden');
      resetCopy();
      runBtn.disabled = true;
      try {
        var res = await execute(tool, inputs, readValues(inputs));
        var f = format(res);
        if (f.v === '' || f.v === 'undefined') { showError('The tool returned no result. Check your input and try again.'); return; }
        if (f.html) out.innerHTML = clean(f.v); else out.textContent = f.v;
        out.style.whiteSpace = f.html ? 'normal' : 'pre-wrap';
        wrap.classList.remove('hidden');
        if (wrap.getBoundingClientRect().bottom > window.innerHeight) wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } catch (err) {
        console.error('[QuickToolHub] Tool error:', err);
        showError('Something went wrong while running this tool' + (err && err.message ? ': ' + err.message : '.') + ' Please check your input and try again.');
      } finally { runBtn.disabled = false; }
    }

    form.addEventListener('submit', function (e) { e.preventDefault(); run(); });
    form.addEventListener('keydown', function (e) {
      var t = e.target;
      if (e.key !== 'Enter' || e.isComposing) return;
      if (t.tagName === 'TEXTAREA' && !(e.ctrlKey || e.metaKey)) return;
      if (t.tagName === 'SELECT' || t.tagName === 'BUTTON') return;
      e.preventDefault(); run();
    });

    $('#resetBtn').addEventListener('click', function () {
      form.reset();
      form.querySelectorAll('textarea[data-auto]').forEach(grow);
      out.textContent = '';
      wrap.classList.add('hidden');
      alertBox.classList.add('hidden');
      resetCopy();
      var firstField = form.querySelector('input:not([type=checkbox]), textarea, select');
      if (firstField) firstField.focus();
    });

    copyBtn.addEventListener('click', function () {
      var text = out.innerText || out.textContent || '';
      function done() {
        copyBtn.querySelector('span').textContent = 'Copied!';
        copyBtn.querySelector('i').className = 'fa-solid fa-check text-teal-600';
        clearTimeout(copyTimer);
        copyTimer = setTimeout(resetCopy, 1800);
      }
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (e) {}
        document.body.removeChild(ta);
      }
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    });

    var firstInput = form.querySelector('input:not([type=checkbox]):not([type=color]), textarea');
    if (firstInput && window.matchMedia('(min-width: 768px)').matches) firstInput.focus({ preventScroll: true });
  }

  /* ---------- boot ---------- */
  function boot() {
    var params = new URLSearchParams(location.search);
    var slug = params.get('tool') || params.get('id') || '';
    var list = toolList();
    if (!list.length) { renderNotFound(true); return; }
    var tool = findTool(list, slug);
    if (!tool) { renderNotFound(false); return; }
    try { renderTool(tool); }
    catch (e) {
      console.error('[QuickToolHub] Render error:', e);
      renderNotFound(false);
    }
  }
  boot();
})();
</script>
</body>
</html>
